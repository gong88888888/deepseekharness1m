# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    readLimit: 2000
    readDefaultLimit: 2

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-subagent
  config:
    provider: efficiency-fixture
    toolName: subagent
    backgroundMode: one-shot
    maxDepth: provider-managed
    structuredOutput: true

- id: tool-jobs
  config:
    deduplicateFinalOutput: true

- id: workflow-worker-thread
  config:
    provider: efficiency-fixture
    maxConcurrentRuns: 1
    maxConcurrentAgents: 1
    maxTotalAgents: 2

- id: tool-workflow
  config:
    executionControls: true

- insert:
    - id: subagent-efficiency-fixture
      name: '../../../packages/subagent/tool-subagent/tests/fixtures/efficiency-snapshot.ts'
